---
# Ansible Automation Platform - Execution Environment tanımı (ansible-builder v3).
#
# Build (RHEL, geçerli AAP aboneliği ve registry.redhat.io girişi ile):
#   podman login registry.redhat.io
#   ansible-builder build -f execution-environment.yml -t <pah>/sql-automation-ee:1.0.0
#   podman push <pah>/sql-automation-ee:1.0.0
#
# ÖNCE KONTROL EDİN: Red Hat'in hazır "ee-supported" image'ı ansible.windows ve
# Kerberos istemcisini zaten içeriyor olabilir. İçeriyorsa custom build gerekmez
# (doğrulama komutu: docs/aap-setup.md §1).
#
# DEFAULT: base image AAP 2.6 namespace'i ile yazıldı. AAP sürümünüz farklıysa
# "ansible-automation-platform-26" kısmını değiştirin (IR-13).
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

dependencies:
  galaxy: collections/requirements.yml
  python: requirements.txt
  # krb5-devel / gcc / python3-devel: pywinrm[kerberos] (pykrb5/gssapi) derlemesi için.
  # RHEL repo'ları build host'un aboneliği üzerinden erişilebilir olmalı.
  system:
    - krb5-workstation [platform:rpm]
    - krb5-devel [platform:rpm]
    - gcc [platform:rpm]
    - python3-devel [platform:rpm]

# krb5.conf image'a GÖMÜLMEZ: realm/KDC ortama özeldir.
# AAP: Settings -> Job Settings -> "Paths to expose to isolated jobs" ile
# controller node'daki /etc/krb5.conf (ve gerekiyorsa /etc/krb5.conf.d) job'lara açılır.
