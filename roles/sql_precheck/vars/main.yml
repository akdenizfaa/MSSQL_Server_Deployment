---
# Microsoft resmi gereksinimleri (SQL Server 2025 / 17.x).
# Bu değerler ortamdan ortama DEĞİŞMEZ; bu yüzden defaults değil vars içinde.
# Kaynak: learn.microsoft.com - Hardware and Software Requirements for SQL Server 2025
sql_precheck_ms_requirements:
  supported_os:
    - { build: 17763, name: "Windows Server 2019" }
    - { build: 20348, name: "Windows Server 2022" }
    - { build: 26100, name: "Windows Server 2025" }
  min_ram_mb: 1024 # Express dışı edition'lar
  min_cpu_mhz: 1400
  min_binaries_free_gb: 6
  # .NET Framework 4.7.2 -> Release DWORD >= 461808
  min_dotnet_release: 461808
