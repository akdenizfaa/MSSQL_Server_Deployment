[defaults]
# Inventory AWX/AAP tarafında job template'ten gelir; CLI kullanımında -i ile verilir.
roles_path          = ./roles
collections_path    = ./collections:~/.ansible/collections:/usr/share/ansible/collections
stdout_callback     = ansible.builtin.default
callback_result_format = yaml
host_key_checking   = False
retry_files_enabled = False
# Windows hedeflerde fact toplama pahalıdır; rol bazında gerektiğinde açılır.
gathering           = explicit
forks               = 20
timeout             = 30

[persistent_connection]
command_timeout = 120
